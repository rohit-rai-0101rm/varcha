name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/varcha
            git pull origin main
            yarn install
            yarn workspace varcha-shared build
            yarn build:backend
            yarn build:frontend
            pm2 restart varcha-backend
            pm2 restart varcha-frontend
